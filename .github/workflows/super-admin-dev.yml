name: Build Super Admin (Development)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, SuperAdminFERunner]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npx ng build --configuration=development

      - name: Publish build to C:\Development\superadminFE\publish
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $target = "C:\Development\superadminFE\publish"
          if (-not (Test-Path "dist")) { throw "dist folder not found. Check outputPath in angular.json." }

          # Angular 17+ writes to dist/<project>/browser; older versions write to dist/<project>
          $project = Get-ChildItem -Path "dist" -Directory | Select-Object -First 1
          $source = $project.FullName
          if (Test-Path (Join-Path $source "browser")) { $source = Join-Path $source "browser" }

          if (Test-Path $target) { Remove-Item -Path "$target\*" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source\*" -Destination $target -Recurse -Force
          Write-Host "Published $source to $target"
